world: 4
name: Grade 4
tier: adventure
defaults:
  mastery: { unlock: 0.6, two_star: 0.75, three_star: 0.9, revisit_days: [2, 7, 21] }

nodes:
  # ---- Operations & Algebraic Thinking ----
  - id: w04.oa.multiplicative-comparison
    title: Times as many
    description: Interpret and solve "times as many" comparisons, telling them apart from "more than".
    ccss: [4.OA.A.1, 4.OA.A.2]
    prerequisites: [w03.oa.mult-div-word-problems]
    representations: [verbal, visual, symbolic]
    engines: [story, sort]
    strategies: [bar-model]

  - id: w04.oa.multistep-word-problems
    title: Multi-step stories
    description: Solve multi-step story problems with whole numbers, including interpreting remainders.
    ccss: [4.OA.A.3]
    prerequisites: [w03.oa.two-step-word-problems, w04.nbt.divide-by-one-digit]
    representations: [verbal, visual, symbolic]
    engines: [story, strategy]
    strategies: [bar-model, estimate-first, interpret-remainder]
    secret_goals:
      - { id: remainder-sense, text: Explained what to do with a remainder before the game asked, kind: custom }

  - id: w04.oa.factors-multiples-primes
    title: Factors and multiples
    description: Find factor pairs, tell multiples, and decide whether a number is prime or composite.
    ccss: [4.OA.B.4]
    prerequisites: [w03.oa.divide-fluently-100]
    representations: [visual, symbolic, physical]
    engines: [build, sort, fluency]
    strategies: [factor-pairs, rectangle-arrays]
    secret_goals:
      - { id: prime-call, text: Called a prime on the first try, kind: no-hints }

  - id: w04.oa.patterns-and-rules
    title: Rule machines
    description: Generate a number or shape pattern from a rule and spot features the rule did not state.
    ccss: [4.OA.C.5]
    prerequisites: [w03.oa.arithmetic-patterns]
    representations: [visual, symbolic, verbal]
    engines: [sim, build]
    secret_goals:
      - { id: fewest-gears, text: Built the rule with the fewest gears possible, kind: shortcut }

  # ---- Number & Operations in Base Ten ----
  - id: w04.nbt.place-value-ten-times
    title: Ten times bigger
    description: Recognize that a digit in one place is ten times what it is in the place to its right.
    ccss: [4.NBT.A.1]
    prerequisites: [w03.nbt.multiply-by-multiples-of-10]
    representations: [visual, symbolic, physical]
    engines: [manipulate, build]
    secret_goals:
      - { id: bundle-up, text: Bundled your way to ten times bigger, kind: strategy }
      - { id: one-shift, text: Moved every digit one place in a single pull, kind: shortcut }

  - id: w04.nbt.read-write-compare-multidigit
    title: Big numbers
    description: Read, write, and compare multi-digit whole numbers in numerals, names, and expanded form.
    ccss: [4.NBT.A.2]
    prerequisites: [w04.nbt.place-value-ten-times, w02.nbt.compare-three-digit]
    representations: [verbal, visual, symbolic]
    engines: [sort, fluency]

  - id: w04.nbt.round-multidigit
    title: Round big numbers
    description: Round multi-digit whole numbers to any place.
    ccss: [4.NBT.A.3]
    prerequisites: [w03.nbt.round-to-10-100, w04.nbt.read-write-compare-multidigit]
    representations: [visual, symbolic, verbal]
    engines: [fluency, manipulate]
    secret_goals:
      - { id: midpoint-call, text: Found the midpoint before deciding which way to round, kind: strategy }

  - id: w04.nbt.add-sub-multidigit-fluent
    title: Column adding and subtracting
    description: Add and subtract multi-digit whole numbers fluently with the standard algorithm.
    ccss: [4.NBT.B.4]
    prerequisites: [w03.nbt.add-sub-within-1000-fluent, w04.nbt.read-write-compare-multidigit]
    representations: [symbolic, visual]
    engines: [fluency, strategy]
    mastery: { fluency_ms: 15000 }

  - id: w04.nbt.multiply-multidigit
    title: Multiply bigger numbers
    description: Multiply up to four digits by one digit and two digits by two digits using place value, area models, and properties.
    ccss: [4.NBT.B.5]
    prerequisites: [w03.oa.multiply-fluently-100, w03.md.area-distributive-additive, w04.nbt.place-value-ten-times]
    representations: [visual, symbolic]
    engines: [build, strategy]
    strategies: [area-model, partial-products, distributive]
    secret_goals:
      - { id: four-partials, text: Built and labeled all four partial products before locking in, kind: strategy }

  - id: w04.nbt.divide-by-one-digit
    title: Divide bigger numbers
    description: Divide up to four-digit dividends by one-digit divisors with remainders, using place value and the relationship to multiplication.
    ccss: [4.NBT.B.6]
    prerequisites: [w03.oa.divide-fluently-100, w04.nbt.multiply-multidigit]
    representations: [visual, symbolic]
    engines: [build, strategy]
    strategies: [partial-quotients, think-multiplication, area-model]
    secret_goals:
      - { id: remainder-tray, text: Every remainder went straight to the tray, kind: streak }

  # ---- Number & Operations — Fractions ----
  - id: w04.nf.fraction-equivalence
    title: Why equivalent fractions work
    description: Explain why a/b equals (n×a)/(n×b) using models and generate equivalent fractions.
    ccss: [4.NF.A.1]
    prerequisites: [w03.nf.equivalent-fractions]
    representations: [visual, symbolic, verbal]
    engines: [manipulate, strategy]
    secret_goals:
      - { id: same-edge, text: Made an equivalent fraction without moving the shaded edge, kind: strategy }

  - id: w04.nf.compare-unlike-fractions
    title: Compare any fractions
    description: Compare fractions with different numerators and denominators using benchmarks or common denominators.
    ccss: [4.NF.A.2]
    prerequisites: [w04.nf.fraction-equivalence, w03.nf.compare-fractions]
    representations: [visual, symbolic, verbal]
    engines: [sort, strategy]
    strategies: [benchmark-half, common-denominator, common-numerator]

  - id: w04.nf.decompose-fractions
    title: Break fractions apart
    description: Understand adding fractions as joining parts of the same whole and decompose fractions into sums.
    ccss: [4.NF.B.3.a, 4.NF.B.3.b]
    prerequisites: [w03.nf.unit-fractions]
    representations: [visual, symbolic, physical]
    engines: [build, manipulate]
    secret_goals:
      - { id: two-ways-unit, text: One of your two ways used only unit fractions, kind: strategy }

  - id: w04.nf.add-sub-like-denominators
    title: Add and subtract same-size pieces
    description: Add and subtract fractions and mixed numbers with like denominators, including in story problems.
    ccss: [4.NF.B.3.c, 4.NF.B.3.d]
    prerequisites: [w04.nf.decompose-fractions]
    representations: [visual, symbolic, verbal, physical]
    engines: [manipulate, story, fluency]
    strategies: [regroup-a-whole]

  - id: w04.nf.multiply-fraction-by-whole
    title: Fractions times whole numbers
    description: Multiply a fraction by a whole number as repeated addition of unit fractions, and solve story problems.
    ccss: [4.NF.B.4]
    prerequisites: [w04.nf.decompose-fractions, w03.oa.multiplication-as-groups]
    representations: [visual, symbolic, verbal]
    engines: [build, story]
    secret_goals:
      - { id: copies, text: Built it by copying the fraction instead of counting pieces, kind: strategy }

  - id: w04.nf.tenths-and-hundredths
    title: Tenths and hundredths
    description: Express tenths as hundredths and add fractions with denominators 10 and 100.
    ccss: [4.NF.C.5]
    prerequisites: [w04.nf.fraction-equivalence]
    representations: [visual, symbolic]
    engines: [manipulate, build]
    secret_goals:
      - { id: trade-strip, text: Traded a tenth for ten hundredths to finish, kind: strategy }

  - id: w04.nf.decimal-notation
    title: Decimals
    description: Write fractions with denominators 10 or 100 as decimals and place them on a number line.
    ccss: [4.NF.C.6]
    prerequisites: [w04.nf.tenths-and-hundredths]
    representations: [visual, symbolic, verbal]
    engines: [manipulate, sort]
    secret_goals:
      - { id: tenths-first, text: "Found the tenth before zooming in, every time", kind: strategy }

  - id: w04.nf.compare-decimals
    title: Compare decimals
    description: Compare two decimals to hundredths by reasoning about their size.
    ccss: [4.NF.C.7]
    prerequisites: [w04.nf.decimal-notation]
    representations: [visual, symbolic]
    engines: [sort, fluency]

  # ---- Measurement & Data ----
  - id: w04.md.unit-conversion
    title: Bigger units to smaller
    description: Express a measurement in a larger unit as a smaller unit within the same system and make conversion tables.
    ccss: [4.MD.A.1]
    prerequisites: [w04.nbt.multiply-multidigit, w03.md.volume-and-mass]
    representations: [symbolic, visual, verbal]
    engines: [build, fluency]

  - id: w04.md.measurement-word-problems
    title: Measurement stories
    description: Solve story problems with distance, time, volume, mass, and money, including simple fractions and decimals.
    ccss: [4.MD.A.2]
    prerequisites: [w04.md.unit-conversion, w04.nf.add-sub-like-denominators, w03.md.time-to-minute]
    representations: [verbal, visual, symbolic]
    engines: [story, sim]

  - id: w04.md.area-perimeter-formulas
    title: Area and perimeter formulas
    description: Use area and perimeter formulas for rectangles to solve real problems, including finding an unknown side.
    ccss: [4.MD.A.3]
    prerequisites: [w03.md.area-by-multiplying, w03.md.perimeter]
    representations: [symbolic, visual, verbal]
    engines: [story, build]
    secret_goals:
      - { id: same-area-two-ways, text: Built two different rectangles with the same area, kind: shortcut }

  - id: w04.md.line-plots-fractions
    title: Line plots with eighths
    description: Make line plots with fractional measurements and add or subtract to answer questions.
    ccss: [4.MD.B.4]
    prerequisites: [w03.md.line-plots-fractions, w04.nf.add-sub-like-denominators]
    representations: [visual, symbolic]
    engines: [build, story]

  - id: w04.md.angles-concept
    title: Angles are turns
    description: Understand an angle as a turn and a degree as one 360th of a full circle.
    ccss: [4.MD.C.5]
    prerequisites: [w03.nf.unit-fractions]
    representations: [visual, physical, symbolic]
    engines: [manipulate, sim]
    secret_goals:
      - { id: full-circle, text: Went all the way around and read 360, kind: custom }

  - id: w04.md.measure-angles
    title: Measure angles
    description: Measure and sketch angles in whole degrees with a protractor.
    ccss: [4.MD.C.6]
    prerequisites: [w04.md.angles-concept]
    representations: [visual, physical, symbolic]
    engines: [manipulate, build]
    secret_goals:
      - { id: zero-first, text: Lined up zero before every reading, kind: strategy }

  - id: w04.md.additive-angles
    title: Angles add up
    description: Find unknown angles by adding or subtracting known angle measures.
    ccss: [4.MD.C.7]
    prerequisites: [w04.md.measure-angles, w04.nbt.add-sub-multidigit-fluent]
    representations: [visual, symbolic]
    engines: [manipulate, story]

  # ---- Geometry ----
  - id: w04.g.lines-and-angles
    title: Points, lines, rays
    description: Draw and identify points, lines, segments, rays, angle types, and parallel and perpendicular lines.
    ccss: [4.G.A.1]
    prerequisites: [w04.md.angles-concept]
    representations: [visual, verbal, physical]
    engines: [sort, build]

  - id: w04.g.classify-by-lines-angles
    title: Sort shapes by lines and angles
    description: Classify shapes by parallel or perpendicular sides and by angle types, including right triangles.
    ccss: [4.G.A.2]
    prerequisites: [w04.g.lines-and-angles, w03.g.quadrilaterals]
    representations: [visual, verbal]
    engines: [sort, build]
    secret_goals:
      - { id: different-each-time, text: "Three shapes in a row, none of them alike", kind: streak }

  - id: w04.g.line-symmetry
    title: Mirror lines
    description: Find lines of symmetry and draw symmetric figures.
    ccss: [4.G.A.3]
    prerequisites: [w03.g.quadrilaterals]
    representations: [visual, physical]
    engines: [manipulate, build]
    secret_goals:
      - { id: all-the-lines, text: Found every line of symmetry on a regular polygon, kind: shortcut }
