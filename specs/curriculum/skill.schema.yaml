# Schema for a curriculum world file (specs/curriculum/worlds/world-NN.yaml).
# JSON Schema, draft 2020-12, written as YAML. Validated by tools/curriculum.py.
#
# A world file holds the skill nodes for one grade. Nodes inherit `defaults`
# (currently only `mastery`) and may override individual keys.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "math-game/world-file"
title: World file
type: object
required: [world, name, tier, defaults, nodes]
additionalProperties: false
properties:
  world:
    type: integer
    minimum: 1
    maximum: 12
  name:
    type: string
    description: "Working name for the world's curriculum scope, e.g. 'Grade 3' or 'Algebra I'. Not the player-facing world name."
  tier:
    type: string
    enum: [playground, adventure, workshop, studio, lab]
  notes:
    type: string
    description: "Authoring notes: pathway choices, what was left out and why"
  defaults:
    type: object
    required: [mastery]
    additionalProperties: false
    properties:
      mastery: { $ref: "#/$defs/mastery" }
  nodes:
    type: array
    minItems: 1
    items: { $ref: "#/$defs/node" }

$defs:
  mastery:
    type: object
    additionalProperties: false
    properties:
      unlock:      { type: number, minimum: 0, maximum: 1, description: "Mastery score at which dependent nodes unlock" }
      two_star:    { type: number, minimum: 0, maximum: 1 }
      three_star:  { type: number, minimum: 0, maximum: 1 }
      fluency_ms:  { type: integer, minimum: 1, description: "Target median response time for fluency engines; omit if not applicable" }
      revisit_days:
        type: array
        minItems: 1
        items: { type: integer, minimum: 1 }
        description: "Spaced revisit intervals in days, e.g. [2, 7, 21]"

  node:
    type: object
    required: [id, title, description, prerequisites, representations, engines]
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: "^w(0[1-9]|1[0-2])\\.[a-z]+\\.[a-z0-9-]+$"
        description: "w{NN}.{domain}.{slug}; NN must equal the file's world"
      title:
        type: string
        description: "Short, player-facing name"
      description:
        type: string
        description: "One sentence: what the player can do when this is mastered"
      source:
        type: string
        enum: [ccss, original]
        default: ccss
        description: "ccss = backbone standard; original = a node we added because the game or the math wanted it"
      ccss:
        type: array
        items: { type: string }
        default: []
        description: "Standard ids covered, e.g. 1.OA.C.6 or F.IF.B.4. Empty for original nodes."
      prerequisites:
        type: array
        items: { type: string }
        description: "Node ids. Each must exist, be in this world or an earlier one, and the graph must stay acyclic."
      representations:
        type: array
        minItems: 2
        uniqueItems: true
        items: { type: string, enum: [symbolic, visual, verbal, physical] }
        description: "Forms the skill is practiced and revisited in; the 3-star revisit uses one the player did not drill"
      engines:
        type: array
        minItems: 1
        uniqueItems: true
        items: { type: string, enum: [fluency, build, sort, manipulate, story, strategy, sim] }
        description: "Mini-game engines that can host this skill"
      mastery:
        $ref: "#/$defs/mastery"
        description: "Overrides merged over the world's defaults"
      strategies:
        type: array
        items: { type: string }
        description: "Named strategies the game can observe or reward"
      secret_goals:
        type: array
        items:
          type: object
          required: [id, text]
          additionalProperties: false
          properties:
            id:   { type: string }
            text: { type: string, description: "Shown after completion" }
            kind: { type: string, enum: [strategy, streak, no-hints, representation, shortcut, custom] }

# Domain codes used in ids (lowercase):
#   Grades 1–8: oa, nbt, nf, md, g, rp, ns, ee, f, sp
#   High school: n (Number & Quantity), a (Algebra), f (Functions), g (Geometry), s (Statistics & Probability)
#   Original nodes use whichever domain fits.
