# Schema for a curriculum skill node. Draft — tighten as the first worlds are authored.
# Expressed as JSON Schema in YAML form.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "math-game/skill-node"
title: Skill node
type: object
required: [id, world, domain, title, description, prerequisites, representations, engines, mastery]
additionalProperties: false
properties:
  id:
    type: string
    pattern: "^w(0[1-9]|1[0-2])\\.[a-z]+\\.[a-z0-9-]+$"
    description: "w{NN}.{domain}.{slug}, e.g. w01.oa.add-within-20"
  world:
    type: integer
    minimum: 1
    maximum: 12
  domain:
    type: string
    description: "CCSSM domain code in lowercase (oa, nbt, nf, md, g, rp, ns, ee, f, sp, a, n, …) or 'x' for original nodes"
  title:
    type: string
  description:
    type: string
    description: "One sentence: what the player can do when this is mastered"
  source:
    type: string
    enum: [ccss, original]
    default: ccss
  ccss:
    type: array
    items: { type: string }
    description: "Standard ids covered, e.g. 1.OA.C.6. Empty for original nodes."
  prerequisites:
    type: array
    items: { type: string }
    description: "Node ids. Must exist; graph must stay acyclic."
  representations:
    type: array
    minItems: 2
    items:
      type: string
      enum: [symbolic, visual, verbal, physical]
  engines:
    type: array
    minItems: 1
    items:
      type: string
      enum: [fluency, build, sort, manipulate, story, strategy, sim]
  mastery:
    type: object
    required: [unlock, two_star, three_star, revisit_days]
    additionalProperties: false
    properties:
      unlock:      { type: number, minimum: 0, maximum: 1, description: "Mastery score at which dependents unlock" }
      two_star:    { type: number, minimum: 0, maximum: 1 }
      three_star:  { type: number, minimum: 0, maximum: 1 }
      fluency_ms:  { type: integer, description: "Target median response time for fluency engines; omit if not applicable" }
      revisit_days:
        type: array
        items: { type: integer, minimum: 1 }
        description: "Spaced revisit intervals, e.g. [2, 7, 21]"
  strategies:
    type: array
    items: { type: string }
    description: "Named strategies the game can observe or reward"
  secret_goals:
    type: array
    items:
      type: object
      required: [id, text]
      properties:
        id:   { type: string }
        text: { type: string, description: "Shown after completion" }
        kind: { type: string, enum: [strategy, streak, no-hints, representation, shortcut, custom] }

# Example
# - id: w01.oa.add-within-20
#   world: 1
#   domain: oa
#   title: Add within 20
#   description: Add two numbers with a sum up to 20 using a strategy, not just counting.
#   ccss: [1.OA.C.6]
#   prerequisites: [w01.oa.add-within-10]
#   representations: [symbolic, visual, verbal]
#   engines: [fluency, manipulate, story]
#   mastery: { unlock: 0.6, two_star: 0.75, three_star: 0.9, fluency_ms: 4000, revisit_days: [2, 7, 21] }
#   strategies: [make-ten, doubles, doubles-plus-one, count-on]
#   secret_goals:
#     - { id: make-ten-five, text: "Used make-ten five times", kind: strategy }
#     - { id: no-fingers, text: "Finished without the counters", kind: representation }
