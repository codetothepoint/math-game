name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  specs-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Validate specs
        run: |
          python3 tools/curriculum.py --check
          python3 tools/recipes.py
          python3 tools/test_mastery.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests (pure Kotlin, no Android SDK)
        run: ./gradlew :core:test --no-daemon
